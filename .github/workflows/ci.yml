name: CI

on:
  push:
    branches: [main, feat/mvs-dev]
  pull_request:
    branches: [main, feat/mvs-dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP 8.2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: moves_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: moves_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security audit
        run: composer audit --no-interaction

      - name: Migration smoke test
        run: |
          php scripts/migrate.php
          php scripts/migrate.php | tee /tmp/migrate-second-run.log
          grep -q 'Migrations concluídas.' /tmp/migrate-second-run.log
          grep -q 'SKIP:' /tmp/migrate-second-run.log

      - name: Migration safety and upgrade tests
        run: php scripts/test-migrations.php

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: PHP syntax
        run: find app tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log

      - name: Authentication HTTP E2E
        env:
          APP_URL: http://127.0.0.1:8080
          SESSION_SECURE: 'false'
          SESSION_HTTP_ONLY: 'true'
          SESSION_SAME_SITE: Lax
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php >/tmp/mvs-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/login >/dev/null; then break; fi
            sleep 0.5
          done
          php scripts/test-auth-middleware.php

  javascript:
    name: JavaScript and WhatsApp bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/talk-whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/talk-whatsapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=low
      - name: JavaScript syntax
        working-directory: .
        run: rg --files -g '*.js' public services scripts tests | while IFS= read -r file; do node --check "$file" || exit 1; done
